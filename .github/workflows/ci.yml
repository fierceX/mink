name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Test (fast, runs first) ────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          # Vite 8 currently resolves Rolldown 1.2.x, whose native bindings
          # require Node >=20.19.0. On 20.18 npm treats those platform packages
          # as failed optional dependencies, so installation appears successful
          # but the Rust build script later fails when it invokes `vite build`.
          node-version: "20.19.0"
      - run: npm ci
        working-directory: crates/mink-server/web
      - name: Homepage interaction regressions
        run: |
          node scripts/test-homepage.mjs
          python3 -m unittest discover -s scripts -p 'test_hero_replay.py'
      - name: Documentation examples
        run: make docs-examples
      - name: Runtime benchmark regression
        run: make bench-check
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p mink-core --features python-sandbox
      # R10：真实 Linux 进程树回收验证（bwrap 缺失或命名空间受限则失败）。
      - name: Install bubblewrap for Linux sandbox integration
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      # Ubuntu24.04+ 默认用 AppArmor 限制非特权 user namespace：bwrap 会在创建
      # 沙箱前以 `setting up uid map: Permission denied` 失败。集成测试要求沙箱
      # 真实可用，这里显式放开，并把“仍不可用”转成带诊断的失败。
      - name: Enable unprivileged user namespaces for bubblewrap
        run: |
          set -euo pipefail
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          fi
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          fi
          probe() {
            bwrap --ro-bind / / --unshare-pid --die-with-parent -- /bin/true
          }
          if ! probe && [ -f /etc/apparmor.d/bwrap ]; then
            # 兜底：加载 Ubuntu 为 bwrap 提供的 AppArmor profile（若镜像内存在）
            sudo apparmor_parser -r /etc/apparmor.d/bwrap || true
          fi
          if ! probe; then
            echo "::error::bubblewrap cannot create unprivileged user namespaces"
            echo "apparmor_restrict_unprivileged_userns=$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo n/a)"
            echo "unprivileged_userns_clone=$(cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || echo n/a)"
            bwrap --version || true
            exit 1
          fi
          echo "bubblewrap userns probe: OK"
      - name: Linux sandbox process-tree integration
        run: |
          MINK_REQUIRE_SANDBOX=1 cargo test -p mink-core --test sandbox_linux -- --nocapture
          MINK_REQUIRE_SANDBOX=1 cargo test -p mink-core --test sandbox_linux -- --nocapture --test-threads=1
      - run: make feature-matrix
      - run: npm test -- --run
        working-directory: crates/mink-server/web
      - run: npm run typecheck
        working-directory: crates/mink-server/web
      - run: npm run build
        working-directory: crates/mink-server/web

  # ── Static docs / homepage validation ──────────────────────────
  pages-check:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
      - run: npm ci
        working-directory: crates/mink-server/web
      - name: Check and assemble documentation
        run: make docs-site
      - name: Install documentation browser
        working-directory: crates/mink-server/web
        run: npx playwright install --with-deps chromium
      - name: Documentation browser acceptance
        run: |
          python3 -m http.server 8026 --bind 127.0.0.1 --directory target/docs-site > /tmp/mink-docs-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          make docs-browser

  # ── Build multi-arch binaries ──────────────────────────────────
  binaries:
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            suffix: linux-amd64
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            suffix: linux-amd64-musl
          - runner: macos-14
            target: aarch64-apple-darwin
            suffix: darwin-arm64
          - runner: ubuntu-22.04
            target: x86_64-unknown-freebsd
            suffix: freebsd-amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Python (for zigbuild)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cargo-zigbuild
        run: pip install -q cargo-zigbuild

      - name: Setup Node (embedded frontend build)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install web deps (embedded frontend)
        run: npm ci
        working-directory: crates/mink-server/web

      - name: Build mink + mink-server binaries
        run: |
          mkdir -p dist
          # 所有发布目标统一由 cargo-zigbuild 驱动。Linux runner 可直接为
          # GNU、musl 和 FreeBSD 提供目标 linker/sysroot，不再为 FreeBSD
          # 启动整套虚拟机；Darwin 仍保留 macOS runner，以使用 Apple SDK。
          cargo zigbuild --release --target ${{ matrix.target }}
          cargo zigbuild -p mink-server --release --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/mink dist/mink-${{ matrix.suffix }}
          cp target/${{ matrix.target }}/release/mink-server dist/mink-server-${{ matrix.suffix }}
          # 内嵌前端校验：server 二进制大小应显著大于纯 Rust 骨架（> 1MB 视为含 dist）
          test "$(stat -c%s dist/mink-server-${{ matrix.suffix }} 2>/dev/null || stat -f%z dist/mink-server-${{ matrix.suffix }})" -gt 1000000

      - uses: actions/upload-artifact@v4
        with:
          name: mink-${{ matrix.suffix }}
          path: dist/mink-${{ matrix.suffix }}

      - uses: actions/upload-artifact@v4
        with:
          name: mink-server-${{ matrix.suffix }}
          path: dist/mink-server-${{ matrix.suffix }}

  # ── Build platform wheels ──────────────────────────────────────
  wheels:
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            arch: arm64
            runner: macos-latest
          - os: linux
            arch: x86_64
            runner: ubuntu-22.04
          - os: linux
            arch: x86_64-musl
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cargo-zigbuild
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: pip install -q cargo-zigbuild

      - name: Install build dependencies
        run: python -m pip install --upgrade pip setuptools wheel build

      - name: Build Rust binary (release)
        run: |
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            cargo zigbuild -p mink-cli --release --target x86_64-unknown-linux-musl --no-default-features --features sdk-bin --bin mink-core
            mkdir -p target/release
            cp target/${{ matrix.target }}/release/mink-core target/release/mink-core
          else
            cargo build -p mink-cli --release --no-default-features --features sdk-bin --bin mink-core
          fi
        env:
          CARGO_TERM_COLOR: always

      - name: Build platform-specific wheel
        run: python scripts/build_wheel.py
        env:
          MINK_SDK_SKIP_BUILD: "1"
          GLIBC_VERSION: ${{ matrix.target == 'x86_64-unknown-linux-musl' && '' || '2_35' }}
          PLATFORM_TAG: ${{ matrix.target == 'x86_64-unknown-linux-musl' && 'musllinux_1_2_x86_64' || '' }}

      - name: Verify wheel contains binary
        run: |
          import zipfile
          from pathlib import Path
          whl = list(Path('dist').glob('*.whl'))[0]
          with zipfile.ZipFile(whl) as z:
              names = z.namelist()
              print('\n'.join(names))
              assert any('_binary/mink-core' in n for n in names), 'missing binary'
        shell: python

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error

  # ── Publish (on v* tag only) ───────────────────────────────────
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binaries, wheels]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # PyPI Trusted Publishing
      contents: write   # GitHub Release
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo package -p mink-core --list
          cargo package -p mink-core --registry crates-io
          cargo publish -p mink-core --registry crates-io || echo "crate already published, skipping"

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mink-*
          path: dist/bin
          merge-multiple: true

      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist/wheels
          merge-multiple: true

      - name: Show all artifacts
        run: ls -lh dist/bin/ dist/wheels/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/bin/mink-*
            dist/bin/mink-server-*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/wheels
          skip-existing: true

  # ── GitHub Pages (docs/ as site root) ──────────────────────────
  pages:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.repository == 'fierceX/mink'
    needs: [test, pages-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
      - run: npm ci
        working-directory: crates/mink-server/web
      - name: Check and assemble documentation
        run: make docs-site

      - name: Upload docs site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/docs-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
